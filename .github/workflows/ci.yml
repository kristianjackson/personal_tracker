# ──────────────────────────────────────────────────────────────────────
# CI — Lint, format, typecheck, test, build
# Runs on every push and pull request targeting main.
# ──────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:          # allow other workflows to reuse this one

# Cancel in-flight runs for the same branch / PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # ── Install ────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Lint ───────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Format check ──────────────────────────────────────────────
      - name: Format check
        run: npm run format:check

      # ── Typecheck ──────────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      # ── Test ───────────────────────────────────────────────────────
      - name: Test
        run: npm test

      # ── Build ──────────────────────────────────────────────────────
      - name: Build
        run: npm run build
